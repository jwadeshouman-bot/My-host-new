<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Create Account · M7MAD_FF PANEL</title>
  <style>
    :root {
      --bg1: #0a0e1a;
      --bg2: #111827;
      --glass: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.10);
      --muted: rgba(255,255,255,.7);
      --text: #f0f4ff;
      --accent: #7c3aed;
      --accent2: #2563eb;
      --accent3: #06b6d4;
      --shadow: 0 18px 60px rgba(0,0,0,.7);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: 
        radial-gradient(circle at 20% 20%, rgba(124,58,237,.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(6,182,212,.10), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(37,99,235,.05), transparent 70%),
        var(--bg1);
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
    }
    /* تأثير الجزيئات المتحركة */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 10% 10%, rgba(255,255,255,.4), transparent),
        radial-gradient(2px 2px at 25% 50%, rgba(255,255,255,.2), transparent),
        radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,.3), transparent),
        radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,.2), transparent),
        radial-gradient(2px 2px at 80% 60%, rgba(255,255,255,.3), transparent),
        radial-gradient(2px 2px at 95% 30%, rgba(255,255,255,.2), transparent);
      background-size: 220px 220px;
      opacity: .5;
      animation: twinkle 6s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: .2; }
      100% { opacity: .7; }
    }

    .card {
      width: min(440px, 92vw);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      padding: 28px 24px;
      position: relative;
      z-index: 1;
      animation: fadeIn .6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      font-size: 20px;
    }
    .title .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 30px rgba(124,58,237,.25);
      flex-shrink: 0;
    }
    .title span {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
    }
    .sub strong { color: var(--accent); -webkit-text-fill-color: var(--accent); }

    .input-group {
      position: relative;
      margin-top: 12px;
    }
    .input-group .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.25);
      font-size: 16px;
      pointer-events: none;
    }
    input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.3);
      color: var(--text);
      outline: none;
      font-size: 14px;
      transition: all .25s ease;
      font-family: inherit;
    }
    input::placeholder { color: rgba(255,255,255,.35); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,.15);
      background: rgba(0,0,0,.4);
    }
    input[type="password"] { letter-spacing: 2px; }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      font-family: inherit;
      min-width: 100px;
      text-align: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.2);
    }
    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 8px 30px rgba(124,58,237,.25);
      flex: 1.5;
    }
    .btn.primary:hover {
      box-shadow: 0 12px 40px rgba(124,58,237,.4);
      transform: translateY(-2px);
    }

    .msg {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      text-align: center;
      font-weight: 500;
    }
    .msg.error { color: #f87171; }
    .msg.success { color: #34d399; }

    .footer-text {
      margin-top: 14px;
      color: rgba(255,255,255,.3);
      font-size: 11px;
      text-align: center;
      font-weight: 500;
      letter-spacing: .3px;
    }
    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-text a:hover { text-decoration: underline; }

    .hint {
      font-size: 12px;
      color: rgba(255,255,255,.3);
      margin-top: 4px;
      padding-left: 44px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">
      <div class="logo">🚀</div>
      <span>Create Account</span>
    </div>
    <div class="sub">
      Normal users get <strong>1</strong> free server.<br>
      Want more? DM <strong>@Zx_Zx666</strong>
    </div>

    <div class="input-group">
      <span class="icon">👤</span>
      <input id="u" placeholder="Username (letters/numbers/_/.)" autocomplete="username">
    </div>

    <div class="input-group">
      <span class="icon">📧</span>
      <input id="e" placeholder="Email" type="email" autocomplete="email">
    </div>

    <div class="input-group">
      <span class="icon">🔒</span>
      <input id="p" placeholder="Password (min 6)" type="password" autocomplete="new-password">
    </div>

    <div class="input-group">
      <span class="icon">✓</span>
      <input id="p2" placeholder="Re-enter password" type="password" autocomplete="new-password">
    </div>

    <div class="row">
      <button class="btn primary" onclick="doCreate()">✨ Create</button>
      <button class="btn" onclick="location.href='/login'">⬅ Back</button>
    </div>

    <div class="msg" id="m"></div>
    <div class="footer-text">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>

<script>
(async()=>{
  try {
    const r = await fetch('/api/signup-status');
    const d = await r.json();
    if (!d.signup_enabled) {
      document.getElementById('m').textContent = '🛑 New account creation is currently disabled by the owner';
      document.getElementById('m').className = 'msg error';
    }
  } catch(e){}
})();

async function doCreate(){
  const m = document.getElementById('m');
  m.textContent = '⏳ Creating...';
  m.className = 'msg';

  const username = document.getElementById('u').value.trim();
  const email = document.getElementById('e').value.trim();
  const password = document.getElementById('p').value;
  const password2 = document.getElementById('p2').value;

  if (!username || !email || !password || !password2) {
    m.textContent = '⚠️ Please fill in all fields';
    m.className = 'msg error';
    return;
  }
  if (password !== password2) {
    m.textContent = '⚠️ Passwords do not match';
    m.className = 'msg error';
    return;
  }
  if (password.length < 6) {
    m.textContent = '⚠️ Password must be at least 6 characters';
    m.className = 'msg error';
    return;
  }

  try {
    const r = await fetch('/api/auth/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, password2 })
    });
    const d = await r.json().catch(() => ({ success: false, message: 'Server error' }));

    if (!r.ok || !d.success) {
      m.textContent = '❌ ' + (d.message || 'Create failed');
      m.className = 'msg error';
      return;
    }

    m.textContent = '✅ Account created! Redirecting to login...';
    m.className = 'msg success';
    setTimeout(() => location.href = '/login', 800);
  } catch (e) {
    m.textContent = '❌ Connection error';
    m.className = 'msg error';
  }
}
</script>
</body>
</html>
