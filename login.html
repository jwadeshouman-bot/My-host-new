<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login · M7MAD_FF PANEL</title>
  <style>
    :root {
      --bg1: #0a0e1a;
      --bg2: #111827;
      --glass: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.10);
      --muted: rgba(255,255,255,.7);
      --text: #f0f4ff;
      --accent: #7c3aed;
      --accent2: #2563eb;
      --accent3: #06b6d4;
      --shadow: 0 18px 60px rgba(0,0,0,.7);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: 
        radial-gradient(circle at 20% 20%, rgba(124,58,237,.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(6,182,212,.10), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(37,99,235,.05), transparent 70%),
        var(--bg1);
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
    }
    /* تأثير الجزيئات المتحركة */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 10% 10%, rgba(255,255,255,.4), transparent),
        radial-gradient(2px 2px at 20% 40%, rgba(255,255,255,.2), transparent),
        radial-gradient(2px 2px at 30% 80%, rgba(255,255,255,.3), transparent),
        radial-gradient(2px 2px at 50% 20%, rgba(255,255,255,.2), transparent),
        radial-gradient(2px 2px at 70% 60%, rgba(255,255,255,.3), transparent),
        radial-gradient(2px 2px at 90% 30%, rgba(255,255,255,.2), transparent);
      background-size: 200px 200px;
      opacity: .6;
      animation: twinkle 6s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: .3; }
      100% { opacity: .8; }
    }

    .card {
      width: min(420px, 92vw);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      padding: 28px 24px;
      position: relative;
      z-index: 1;
      animation: fadeIn .6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      font-size: 20px;
    }
    .title .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 30px rgba(124,58,237,.25);
      flex-shrink: 0;
    }
    .title span {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.3);
      color: var(--text);
      outline: none;
      margin-top: 12px;
      font-size: 14px;
      transition: all .25s ease;
      font-family: inherit;
    }
    input::placeholder { color: rgba(255,255,255,.35); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,.15);
      background: rgba(0,0,0,.4);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      font-family: inherit;
      min-width: 100px;
      text-align: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.2);
    }
    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 8px 30px rgba(124,58,237,.25);
      flex: 1.5;
    }
    .btn.primary:hover {
      box-shadow: 0 12px 40px rgba(124,58,237,.4);
      transform: translateY(-2px);
    }

    .msg {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      text-align: center;
      font-weight: 500;
    }
    .msg.error { color: #f87171; }
    .msg.success { color: #34d399; }

    .footer-text {
      margin-top: 14px;
      color: rgba(255,255,255,.3);
      font-size: 11px;
      text-align: center;
      font-weight: 500;
      letter-spacing: .3px;
    }
    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-text a:hover { text-decoration: underline; }

    /* أيقونات داخل الحقول */
    .input-group { position: relative; }
    .input-group .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.25);
      font-size: 16px;
      pointer-events: none;
    }
    .input-group input { padding-left: 44px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">
      <div class="logo">🚀</div>
      <span>M7MAD_FF PANEL</span>
    </div>
    <div class="sub">Login to your account</div>

    <div class="input-group">
      <span class="icon">👤</span>
      <input id="u" placeholder="Username" autocomplete="username">
    </div>
    <div class="input-group">
      <span class="icon">🔒</span>
      <input id="p" placeholder="Password" type="password" autocomplete="current-password">
    </div>

    <div class="row">
      <button class="btn primary" onclick="doLogin()">➜ Login</button>
      <button class="btn" onclick="location.href='/create'">✨ Create</button>
    </div>

    <div class="msg" id="m"></div>
    <div class="footer-text">
      Admin access is restricted. <a href="/create">Create account</a>
    </div>
  </div>

<script>
async function doLogin(){
  const m = document.getElementById('m');
  m.textContent = '⏳ Logging in...';
  m.className = 'msg';
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  if(!username || !password){
    m.textContent = '⚠️ Please fill in all fields';
    m.className = 'msg error';
    return;
  }
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json().catch(() => ({ success: false, message: 'Server error' }));
    if (!r.ok || !d.success) {
      m.textContent = '❌ ' + (d.message || 'Login failed');
      m.className = 'msg error';
      return;
    }
    m.textContent = '✅ Redirecting...';
    m.className = 'msg success';
    setTimeout(() => location.href = d.is_admin ? '/admin' : '/', 500);
  } catch (e) {
    m.textContent = '❌ Connection error';
    m.className = 'msg error';
  }
}
</script>
</body>
</html>
